name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Rust tests
        run: cargo test

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python
      - name: Install wheel and smoke test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist openair-rs-py
          python -c "import openair; a = openair.parse_file('example_data/Switzerland.txt'); assert len(a) > 0, a; print(len(a), 'airspaces')"
