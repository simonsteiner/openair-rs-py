on:
  workflow_call:
  pull_request:
  push:
    branches: [master, main]

name: CI

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run check
        run: cargo check --all-features
      - name: Run tests (default features)
        run: cargo test
      - name: Run tests (with serde)
        run: cargo test --features serde
      - name: Run example
        run: cargo run --example parse_file example_data/Switzerland.txt

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  rustfmt:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-10-18
          components: rustfmt
      - run: cargo +nightly-2025-10-18 fmt -- --check

  python:
    name: Python wheel (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python
      - name: Install wheel and run tests
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist openair-rs-py
          python -m pip install pytest
          python -m pytest

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --explicit-package-bases python tests/python
