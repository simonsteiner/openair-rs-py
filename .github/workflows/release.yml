name: Release

# Manually triggered: Actions → Release → Run workflow, on main.
# Runs CI, bumps the version in pyproject.toml and uv.lock, rolls the
# CHANGELOG "### Unreleased" section into a dated one, pushes the commit and
# the tag, then dispatches publish.yml at the tag. Publishing lives only in
# publish.yml: a tag pushed with GITHUB_TOKEN does not trigger workflows, but a
# workflow_dispatch does, so the PyPI trusted publisher stays publish.yml.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # Push the release commit and tag
      contents: write
      # Dispatch publish.yml
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv version --bump "$BUMP" --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      # Before anything is pushed: an empty or missing Unreleased section
      # stops the release here.
      - name: Roll CHANGELOG
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          python3 scripts/changelog.py roll "$VERSION"
          python3 scripts/changelog.py notes "$VERSION"

      # --atomic: main and the tag land together or not at all. The push is
      # rejected if main moved since this run started.
      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "Version $VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Dispatch publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh workflow run publish.yml --ref "v$VERSION"
          echo "Released v$VERSION; publishing in [publish.yml](${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish.yml)." >> "$GITHUB_STEP_SUMMARY"
