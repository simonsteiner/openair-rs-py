# Ref: https://github.com/evilmartians/lefthook
# Install the git hooks with: uv run lefthook install

min_version: 2.0.5 # `args:` on script jobs

remotes:
  # The shared token-budget script. A tag, never a commit SHA. Bump `ref` to
  # update; the next commit fetches it.
  - git_url: https://github.com/simonsteiner/skills
    ref: filetokens.v1.0.0
    configs:
      - lefthook/file-tokens.yml

pre-commit:
  parallel: true
  jobs:
    # Every staged file an agent writes stays under 5,000 tokens (bytes / 4), so
    # an agent can read it whole. Lockfiles, build output, binaries and generated
    # files are skipped; mark more with linguist-generated in .gitattributes.
    # On failure it prints how to split the file. The script comes from the
    # remote above; the budget is set here.
    - name: file-tokens
      script: check-file-tokens.py
      runner: python3
      args: --max-tokens 5000 {staged_files}
  commands:
    ruff-check:
      priority: 1
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    ruff-format:
      priority: 2
      glob: "*.{py,pyi}"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    mypy:
      priority: 3
      glob: "*.{py,pyi}"
      run: uv run mypy --explicit-package-bases {staged_files}

    # Same pinned nightly as upstream's CI: .rustfmt.toml uses unstable
    # import-grouping options that stable rustfmt ignores.
    # One-time: rustup toolchain install nightly-2025-10-18 --component rustfmt
    rustfmt:
      priority: 4
      glob: "*.rs"
      run: cargo +nightly-2025-10-18 fmt -- {staged_files}
      stage_fixed: true

    # Whole crate rather than the staged files: clippy lints a crate, not a
    # file. lib.rs has `#![deny(clippy::all)]`, so this matches what fails
    # the build anyway.
    clippy:
      priority: 5
      glob: "*.rs"
      run: cargo clippy --features python --all-targets -- -D warnings

    cspell:
      priority: 6
      glob: "*.{py,pyi,rs,md,txt,toml,yml,yaml,json,cfg,ini}"
      run: npx --yes cspell --no-progress --no-must-find-files --config cspell.json {staged_files}

pre-push:
  commands:
    cargo-test:
      run: cargo test --features serde

    pytest:
      run: uv run pytest
