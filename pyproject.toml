[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "openair-rs-py"
version = "0.1.4"
description = "Python bindings for OpenAir airspace file parser"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["airspace", "aviation", "openair", "parser"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    {name = "Danilo Bargen", email = "mail@dbrgn.ch"},
    {name = "Simon Steiner", email = "simonsteiner@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dynamic = []

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
    "isort>=9.0.1",
    "maturin>=1.15.0",
    "mypy>=2.3.1",
    "pre_commit>=4.6.2",
    "pydocstyle>=6.3.0",
    "twine>=7.0.0",
]

[tool.maturin]
features = ["pyo3/extension-module", "python"]
python-source = "python"
