[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "openair-rs-py"
version = "0.2.1"
description = "Fast, typed Python bindings for reading and writing OpenAir airspace files, powered by the Rust openair crate"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["airspace", "aviation", "openair", "parser"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    {name = "Danilo Bargen", email = "mail@dbrgn.ch"},
    {name = "Simon Steiner", email = "simonsteiner@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dynamic = []

[project.scripts]
openair = "openair.cli:main"

[project.urls]
Repository = "https://github.com/simonsteiner/openair-rs-py"
Changelog = "https://github.com/simonsteiner/openair-rs-py/blob/main/CHANGELOG.md"
Upstream = "https://github.com/glide-rs/openair-rs"

[dependency-groups]
dev = [
    "lefthook>=2.1.10",
    "maturin>=1.15.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.maturin]
features = ["pyo3/extension-module", "python"]
python-source = "python"

# Rebuild the extension on `uv sync`/`uv run` when the Rust side changes, not
# only when pyproject.toml does.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["python"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, D docstrings,
# UP pyupgrade (modern syntax for target-version), B bugbear.
# E501 (line length) and E203 are left to the formatter.
select = ["E", "W", "F", "I", "D", "UP", "B"]
ignore = ["E501", "E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["openair"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
mypy_path = "python"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true


[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests/python"]
