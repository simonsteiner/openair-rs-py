[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "openair-rs-py"
version = "0.1.4"
description = "Python bindings for OpenAir airspace file parser"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["airspace", "aviation", "openair", "parser"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    {name = "Danilo Bargen", email = "mail@dbrgn.ch"},
    {name = "Simon Steiner", email = "simonsteiner@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dynamic = []

[dependency-groups]
dev = [
    "lefthook>=2.1.10",
    "maturin>=1.15.0",
    "mypy>=2.3.1",
    "ruff>=0.16.3",
]

[tool.maturin]
features = ["pyo3/extension-module", "python"]
python-source = "python"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["python"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, D docstrings.
# E501 (line length) and E203 are left to the formatter.
select = ["E", "W", "F", "I", "D"]
ignore = ["E501", "E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["openair"]

[tool.mypy]
mypy_path = "python"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

